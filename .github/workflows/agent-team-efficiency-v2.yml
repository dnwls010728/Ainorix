name: Agent team efficiency milestone 2

on:
  push:
    branches:
      - feature/agent-team-efficiency

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-team-efficiency
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply milestone 2 patch
        run: python .github/scripts/apply_agent_team_efficiency_v2.py

      - name: Build OwnEngine
        shell: cmd
        run: build.bat

      - name: Run existing tests
        shell: cmd
        run: build\bin\oe_tests.exe

      - name: Inject and build focused routing test
        shell: pwsh
        run: |
          cmake -S . -B build "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=${{ github.workspace }}/tests/team_efficiency/Inject.cmake"
          cmake --build build --target oe_team_efficiency_tests
          .\build\bin\oe_team_efficiency_tests.exe

      - name: Regenerate API docs
        run: python tools/gen_api_docs.py

      - name: Check repository invariants
        shell: pwsh
        run: |
          if ((Get-FileHash AGENTS.md).Hash -ne (Get-FileHash CLAUDE.md).Hash) { throw 'AGENTS.md and CLAUDE.md differ' }
          git diff --check

      - name: Commit verified milestone
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply_agent_team_efficiency_v2.py
          Remove-Item .github/workflows/agent-team-efficiency-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Team: make agent handoffs explicit by default [skip ci]"
          git push origin HEAD:feature/agent-team-efficiency
