name: Verify structured direct handoff

on:
  push:
    branches:
      - feature/agent-team-efficiency

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-team-efficiency
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply structured handoff patch
        run: python .github/scripts/apply_direct_handoff.py

      - name: Build OwnEngine
        shell: cmd
        run: build.bat

      - name: Run existing tests
        shell: cmd
        run: build\bin\oe_tests.exe

      - name: Build and run focused routing test
        shell: pwsh
        run: |
          cmake -S . -B build "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=${{ github.workspace }}/tests/team_efficiency/Inject.cmake"
          cmake --build build --target oe_team_efficiency_tests
          .\build\bin\oe_team_efficiency_tests.exe

      - name: Regenerate API docs
        run: python tools/gen_api_docs.py

      - name: Check repository invariants
        shell: pwsh
        run: |
          if ((Get-FileHash AGENTS.md).Hash -ne (Get-FileHash CLAUDE.md).Hash) { throw 'AGENTS.md and CLAUDE.md differ' }
          git diff --check

      - name: Commit verified change
        shell: pwsh
        run: |
          git fetch origin feature/agent-team-efficiency
          $remote = git rev-parse origin/feature/agent-team-efficiency
          $local = git rev-parse HEAD
          if ($remote -ne $local) { throw "branch moved during verification: $local -> $remote" }
          Remove-Item .github/scripts/apply_direct_handoff.py
          Remove-Item .github/workflows/direct-handoff-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Team: route explicit handoffs directly [skip ci]"
          git push origin HEAD:feature/agent-team-efficiency
