# OwnEngine MCP server for Codex. Build the project before starting Codex.
# Paths target this Windows checkout; update them if the repository moves.
[mcp_servers.ownengine]
command = 'E:\Projects\OwnEngine\build\bin\oe.exe'
args = ['mcp', 'samples/Hello']
cwd = 'E:\Projects\OwnEngine'
startup_timeout_sec = 20

# Attach to an already running `oe editor ... --port 7777` session when needed.
# Enable only while the editor is running.
[mcp_servers.ownengine_editor]
command = 'E:\Projects\OwnEngine\build\bin\oe.exe'
args = ['mcp', '--connect', '7777']
cwd = 'E:\Projects\OwnEngine'
enabled = false
